# --- Zeitaufloesung, Foerdermodell, PPA (v5.4) --------------------------------
annahmen_modell_titel: "Zeitauflösung, Fördermodell und PPA"
annahmen_zeitaufloesung_titel: "**Zeitauflösung der Erlösrechnung**"
annahmen_zeitaufloesung_hinweis: "Jahresauflösung rechnet eine Jahresmenge gegen einen Jahresmarktwert. Die Monatsauflösung verteilt die Jahreserzeugung über die Einspeisekurve auf zwölf Monate und rechnet sie gegen die Monatsmarktwerte des Szenarios — genauer, weil PV im Sommer viel erzeugt und der Preis dann niedrig ist. Cashflow, Finanzierung und Steuer bleiben jährlich."
annahmen_zeitaufloesung_label: "Zeitauflösung"
annahmen_zeitaufloesung_hilfe: "Liegen für ein Kalenderjahr keine Monatswerte vor, gilt dessen Jahreswert für alle zwölf Monate — die Umschaltung bleibt also auch mit unvollständigen Daten rechenbar."
annahmen_aufloesung_jahr: "Jahreswerte"
annahmen_aufloesung_monat: "Monatswerte"
annahmen_einspeisekurve_titel: "**Einspeisekurve**"
annahmen_einspeisekurve_hinweis: "Anteil der Jahreserzeugung je Monat. Sie gilt für alle Projekte und wird beim Rechnen auf 100 % normiert — gerundete Prozentwerte verändern die Jahresmenge also nicht."
annahmen_einspeisekurve_summe: "Summe der Anteile: {summe} % (wird auf 100 % normiert)."
annahmen_col_monat: "Monat"
annahmen_col_anteil_jahreserzeugung: "Anteil Jahreserzeugung (%)"
annahmen_praemienmodell_titel: "**Marktprämienmodell**"
annahmen_praemienmodell_hinweis: "Vertragsform zwischen Betreiber und Förderstelle. Sie bestimmt, was bei Marktpreisen über dem anzulegenden Wert geschieht — unter ihm wird in allen drei Modellen aufgezahlt."
annahmen_praemienmodell_label: "Modell"
annahmen_modell_einseitig: "Einseitiger CfD — Vergütung = MAX(Marktwert, anzulegender Wert)"
annahmen_modell_zweiseitig: "Zweiseitiger CfD — Vergütung = anzulegender Wert, Überschuss geht vollständig zurück"
annahmen_modell_eag: "Zweiseitig mit Toleranzband (EAG Österreich) — Rückzahlung erst oberhalb des Bandes"
annahmen_eag_rueckzahlung_hinweis: "Parameter des Toleranzbandes. Nach § 10 EAG sind 66 % des übersteigenden Betrags zurückzuzahlen, sobald der Referenzmarktwert den anzulegenden Wert um mehr als 40 % übersteigt; für Photovoltaik gilt das ab 5 MW Engpassleistung. Einstellbar, weil diese Größen Gegenstand laufender Novellen sind."
annahmen_eag_ab_mw_label: "Rückzahlung ab (MW)"
annahmen_eag_ab_mw_hilfe: "Engpassleistung, ab der die Rückzahlungspflicht greift. Kleinere Anlagen behalten ihren Übergewinn vollständig. Verglichen wird mit der Nennleistung des Projekts."
annahmen_eag_band_label: "Toleranzband (%)"
annahmen_eag_band_hilfe: "Erst oberhalb des um diesen Anteil erhöhten anzulegenden Werts entsteht eine Rückzahlung."
annahmen_eag_anteil_label: "Rückzahlungsanteil (%)"
annahmen_eag_anteil_hilfe: "Anteil des über dem Band liegenden Betrags, der an die Förderstelle zurückgeht."
annahmen_ppa_titel: "**PPA-Vorschlagswerte**"
annahmen_ppa_hinweis: "Nur Vorbelegung der Projektmaske. Gerechnet wird immer mit den Werten des jeweiligen Projekts — ein PPA ist Vertragssache und nicht global."
annahmen_ppa_anteil_label: "Anteil (%)"
annahmen_ppa_preis_label: "Preis (€/MWh)"
annahmen_ppa_laufzeit_label: "Laufzeit (Jahre)"
annahmen_ppa_index_label: "Indexierung (%/Jahr)"
formular_ppa_titel: "**Vermarktung (PPA / Merchant)**"
formular_ppa_anteil_label: "PPA-Anteil (%)"
formular_ppa_anteil_hilfe: "Anteil der Erzeugung, der zum festen PPA-Preis verkauft wird; der Rest geht an den Spotmarkt. 0 % = reine Merchant-Vermarktung. Die Förderung bleibt davon unberührt: Die Marktprämie bemisst sich am Referenzmarktwert, nicht am tatsächlich erzielten Preis."
formular_ppa_preis_label: "PPA-Preis (€/MWh)"
formular_ppa_preis_hilfe: "Vereinbarter Preis im ersten PPA-Jahr; die Indexierung wirkt ab dem zweiten."
formular_ppa_laufzeit_label: "Laufzeit (Jahre)"
formular_ppa_laufzeit_hilfe: "Anzahl der Betriebsjahre ab dem Startjahr. Danach wird die volle Menge merchant vermarktet."
formular_ppa_index_label: "Indexierung (%/Jahr)"
formular_ppa_index_hilfe: "Jährliche Steigerung des PPA-Preises. 0 = nominal fix; bei langen Verträgen sind 1–2 %/Jahr marktüblich."
formular_ppa_start_label: "Erstes PPA-Betriebsjahr"
formular_ppa_start_hilfe: "1 = ab Inbetriebnahme. Höhere Werte bilden ab, dass die ersten Jahre noch merchant laufen."
