formular_pachtmodus_hilfe: "Fix: fester Betrag je Jahr, unabhängig vom Umsatz (bisheriges Verhalten). Umsatzbeteiligung: Der Verpächter erhält einen Anteil am Jahresumsatz - mindestens aber eine fixe Mindestpacht je Hektar. Gerade in späteren Betriebsjahren (nach EAG-Förderende) kann die stetig mit der Inflation steigende Mindestpacht die Umsatzbeteiligung übersteigen."
formular_pacht_flaeche_umsatz_hilfe: "Berechnungsgrundlage der Mindestpacht (Fläche × Mindestpacht/ha)."
formular_pacht_umsatzbeteiligung_label: "Umsatzbeteiligung (%)"
formular_pacht_umsatzbeteiligung_hilfe: "Anteil am Jahresumsatz, den der Verpächter erhält. Marktüblich sind ca. 5,5 %."
formular_pacht_mindestpacht_label: "Mindestpacht (€/ha/Jahr)"
formular_pacht_mindestpacht_hilfe: "Wird mit der allgemeinen Kosteninflation (Globale Annahmen) indexiert. Die tatsächlich gezahlte Pacht ist das Maximum aus Umsatzbeteiligung und dieser (indexierten) Mindestpacht × Fläche."
annahmen_pacht_umsatzbeteiligung_vorschlag_label: "Umsatzbeteiligung-Vorschlagswert für neue Projekte (%)"
annahmen_pacht_umsatzbeteiligung_vorschlag_hilfe: "Dient nur als Vorbelegung im Formular „Neues Projekt“ bei Pachtmodus Umsatzbeteiligung; tatsächlich angewendet wird der projektspezifische Wert. Marktüblich sind ca. 5,5 %."
annahmen_steuermodus_gewerbesteuer_de: "Deutsche Gewerbesteuer"
annahmen_gewerbesteuer_hinweis: "Für Personengesellschaften wie GmbH & Co. KG: Steuer = MAX(EBT − AfA − Freibetrag, 0) × Steuermesszahl (3,5 %) × Hebesatz. Bewusst ohne Verlustvortrag (jedes Jahr unabhängig betrachtet) - echte Gewerbesteuer kennt zwar einen Verlustvortrag (§10a GewStG), dieser ist hier vereinfachend nicht abgebildet."
annahmen_gewerbesteuer_hebesatz_label: "Hebesatz (%)"
annahmen_gewerbesteuer_hebesatz_hilfe: "Gemeindeabhängig, häufig 400-450 %."
annahmen_gewerbesteuer_freibetrag_label: "Freibetrag (€/Jahr)"
annahmen_gewerbesteuer_freibetrag_hilfe: "Gesetzlicher Freibetrag bei Personengesellschaften - Stand 2026: 24.500 €/Jahr."
annahmen_gewerbesteuer_effektiv_hinweis: "Effektiver Steuersatz: {satz} % (3,5 % × Hebesatz)."

# --- Globale Annahmen: Marktsystematik (Länderschalter) ----------------------------
annahmen_marktsystem_titel: "**Marktsystematik**"
annahmen_marktsystem_hinweis: "Der Länderschalter stellt die gesamte Marktsystematik als Paket um: Regel für negative Preise (6h/1h), Steuermodus, Zinsberechnungsmethodik, Titelzeile der App und die Methodik der Seite „Marktprämie“ (Österreich: empirisches EAG-Ausschreibungsmodell, Deutschland: manueller EEG-Marktprämienzuschlag). Der Wechsel wird sofort gespeichert und wirkt auf alle Projekte; die einzelnen Einstellungen bleiben danach änderbar."
annahmen_markt_oesterreich: "Österreich (EAG)"
annahmen_markt_deutschland: "Deutschland (EEG)"

# --- Marktprämienseite: deutsches EEG-Modell ---------------------------------------
auktion_intro_titel_de: "### EEG-Marktprämie (Photovoltaik, Deutschland)"
auktion_intro_beschreibung_de: "Deutsches Marktsystem: Der erwartete Marktprämienzuschlag (anzulegender Wert) wird manuell vorgegeben. Das empirische Ausschreibungsmodell (Historie, Kurven-Fitting, Prognose) basiert auf den österreichischen OeMAG-Ausschreibungen und ist im deutschen Modus deaktiviert."
auktion_de_zuschlag_label: "Erwarteter Marktprämienzuschlag / anzulegender Wert (ct/kWh)"
auktion_de_zuschlag_hilfe: "Manuell erwarteter Zuschlagswert der nächsten EEG-Ausschreibung (Freiflächensegment). Wird gespeichert und kann unten an ein Projekt übergeben werden."
auktion_de_empirie_hinweis: "Die folgende empirische Methodik (Ausschreibungshistorie, Verteilungs-Fitting, Prognosemodell) bezieht sich auf die österreichischen EAG-Ausschreibungen und ist im deutschen Marktsystem ausgegraut. Zum Aktivieren in den globalen Annahmen auf Österreich umschalten."

