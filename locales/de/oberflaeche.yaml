annahmen_eag_foerderdauer_label: "EAG-Förderdauer (Jahre)"
annahmen_betrachtungsdauer_label: "Betrachtungsdauer (Jahre)"
annahmen_kreditlaufzeit_label: "Kreditlaufzeit (Jahre)"
