# --- Feed-in curve per mounting type (v5.7) ----------------------------------
annahmen_bauform_label: "Stored curves"
annahmen_bauform_eigene: "Custom curve"
annahmen_bauform_hilfe: "“Pult” (fixed tilt) and “Tracker” are derived from hourly series of the same site and weather year (8,760 values, summed per month and normalised to 100 %). The choice takes effect immediately and replaces the table below; “Custom curve” keeps the current values and only drops the link to a mounting type."

annahmen_praemienmodell_titel: "**Market premium model**"
annahmen_praemienmodell_hinweis: "Contract form between operator and support body. It decides what happens above the applicable value — below it, all three models top up."
annahmen_praemienmodell_label: "Model"
annahmen_modell_einseitig: "One-sided CfD — payment = MAX(market value, applicable value)"
annahmen_modell_zweiseitig: "Two-sided CfD — payment = applicable value, surplus fully repaid"
annahmen_modell_eag: "Two-sided with tolerance band (EAG Austria) — repayment only above the band"
annahmen_eag_rueckzahlung_hinweis: "Parameters of the tolerance band. Under § 10 EAG, 66 % of the excess must be repaid once the reference market value exceeds the applicable value by more than 40 %; for photovoltaics this applies from 5 MW. Adjustable, as these figures are subject to ongoing amendments."
annahmen_eag_ab_mw_label: "Repayment from (MW)"
annahmen_eag_ab_mw_hilfe: "Capacity from which the repayment obligation applies. Smaller plants keep their surplus in full. Compared against the project's rated capacity."
annahmen_eag_band_label: "Tolerance band (%)"
annahmen_eag_band_hilfe: "Repayment starts only above the applicable value increased by this share."
annahmen_eag_anteil_label: "Repayment share (%)"
annahmen_eag_anteil_hilfe: "Share of the amount above the band that goes back to the support body."
annahmen_ppa_titel: "**PPA default values**"
annahmen_ppa_hinweis: "Prefill for the project form only. Calculations always use the project's own values — a PPA is a contract, not a global setting."
annahmen_ppa_anteil_label: "Share (%)"
annahmen_ppa_preis_label: "Price (€/MWh)"
annahmen_ppa_laufzeit_label: "Term (years)"
annahmen_ppa_index_label: "Indexation (%/year)"
formular_ppa_titel: "**Marketing (PPA / merchant)**"
formular_finanzierung_titel: "Financing"
formular_ekanteil_hilfe: "Equity share of the investment cost."
formular_fkzins_hilfe: "Interest rate on the loan amount."
formular_erloese_titel: "Revenues"
formular_eag_zuschlag_hilfe: "The strike price from the auction — the model's single biggest lever. Below it, the market premium tops up the revenue."
formular_ppa_titel_kurz: "PPA"
formular_abgaben_titel: "Costs per MWh"
formular_vermarktung_knopf: "PPA and levies …"
formular_vermarktung_hilfe: "PPA contract terms plus municipal levy and direct-marketing costs. Both levies are operating costs per MWh, not revenue items."
formular_vermarktung_zusammenfassung: "{ppa} · DM {dv} €/MWh · levy {gemeinde} €/MWh"
formular_vermarktung_ppa_anteil: "PPA {anteil} %"
formular_vermarktung_ohne_ppa: "PPA —"
formular_ppa_anteil_label: "PPA share (%)"
formular_ppa_anteil_hilfe: "Share of generation sold at the fixed PPA price; the rest goes to the spot market. 0 % = pure merchant. Support is unaffected: the market premium is measured against the reference market value, not the price actually achieved."
formular_ppa_preis_label: "PPA price (€/MWh)"
formular_ppa_preis_hilfe: "Agreed price in the first PPA year; indexation applies from the second."
formular_ppa_laufzeit_label: "Term (years)"
formular_ppa_laufzeit_hilfe: "Number of operating years from the start year. Afterwards the full volume is sold merchant."
formular_ppa_index_label: "Indexation (%/year)"
formular_ppa_index_hilfe: "Annual increase of the PPA price. 0 = nominally fixed; 1-2 %/year is common for long contracts."
formular_ppa_start_label: "First PPA operating year"
formular_ppa_start_hilfe: "1 = from commissioning. Higher values model the first years still running merchant."

# --- Szenarien als Bild (v5.4.1) ---------------------------------------------
annahmen_szenarien_plot_titel: "**Scenarios compared**"
annahmen_szenarien_plot_hinweis: "Solar market value, wholesale price (baseload) and generation during negative-price hours, one line per scenario. The gap between the first two curves is PV cannibalisation; the third follows the rule selected above (6h/1h). The numbers behind them are in the tabs below."
annahmen_familie_bauform_label: "Mounting type"
annahmen_familie_preis_label: "Price scenario"
annahmen_familie_preis_hilfe: "Central is the expected path, Low and High the range. Older vintages carry Central only."
annahmen_szenarien_alle_zeigen: "Show all scenarios ({anzahl} more)"
annahmen_szenarien_alle_zeigen_hilfe: "Also draws Low, High and the tracker variants. With many vintages the overview quickly becomes unreadable — but for the price range of a single vintage it is exactly right."
annahmen_szenarien_auswahl_hinweis: "One curve per family is shown: {bauform} and {preisszenario}. Low, High and the other mounting types remain available in the tabs below and in the project selection."
annahmen_szenario_umfang: "{jahre} calendar years stored, {monatsjahre} of them with monthly values."
annahmen_zahlen_zeigen: "Edit numbers"
annahmen_zahlen_zeigen_hilfe: "Shows this scenario's annual values as a table. Monthly series are maintained via the Excel round trip — 432 values per scenario are not a job for a form."

# --- Aurora-Import (v5.5) -----------------------------------------------------
aurora_titel: "Import Aurora market data"
aurora_hinweis: "Aurora provides four files per scenario: system and technology data, each annual and monthly. The technology file yields market value (capture price), curtailment rates and the feed-in curve; the system file provides the inflation index and base year. **The monthly technology file is mandatory** — without monthly values, two-sided CfD and clawback cannot be calculated."
aurora_tech_monat: "Technology – monthly (required)"
aurora_tech_monat_hilfe: "Contains per technology and month: capture price, curtailment rate below zero (1h/6h) and generation. All scenario curves come from this file."
aurora_tech_jahr: "Technology – annual (optional)"
aurora_tech_jahr_hilfe: "Read only as a cross-check: if the generation-weighted monthly average deviates by more than 2 % from the stated annual value, a warning appears. Calculations always use the monthly values."
aurora_system_jahr: "System – annual (recommended)"
aurora_system_jahr_hilfe: "Provides the inflation index (\"EUR Inflation, Index relative to …\") and thus base year and average rate of the market price curves."
aurora_system_monat: "System – monthly (optional)"
aurora_system_monat_hilfe: "Fallback source for the inflation index if the annual file is missing."
aurora_warte_auf_datei: "Please load the monthly technology file first — it carries capture price and curtailment rates per month."
aurora_keine_technologien: "The file has no \"Group\"/\"Subgroup\" columns — this does not look like an Aurora technology file."
aurora_technologie_label: "Technology"
aurora_technologie_hilfe: "The rows the scenario is built from. For a PV valuation, the market's solar technology; the most general solar entry is preselected."
aurora_name_label: "Scenario name"
aurora_name_hilfe: "The name shown in the project form. An existing scenario with the same name is replaced — re-importing the same study is a correction, not a second curve."
aurora_preisbasis_label: "Capture price"
aurora_preisbasis_hilfe: "The uncurtailed price is the right one: the model applies the effect of negative prices itself via the curtailment rate. With the already curtailed price it would count twice."
aurora_preis_uncurtailed: "Uncurtailed (recommended)"
aurora_preis_curtailed: "Curtailed below zero"
aurora_uebernimm_kurve: "Adopt feed-in curve"
aurora_uebernimm_kurve_hilfe: "Derives the twelve monthly shares from the selected technology's monthly generation (average over all complete years) and replaces the current curve."
aurora_uebernimm_inflation: "Adopt inflation"
aurora_uebernimm_inflation_hilfe: "Sets base year and average rate of the market price curves from the system file's inflation index."
aurora_setze_monatsmodus: "Switch to monthly values"
aurora_setze_monatsmodus_hilfe: "Sets the revenue calculation to monthly resolution — the prerequisite for the imported monthly curves to take effect at all."
aurora_importieren: "Check and import"
aurora_erfolg: "Scenario \"{name}\" saved: {technologie}, {von}–{bis}, {monatsjahre} years with complete monthly series."
aurora_inflation_uebernommen: "Market price curve inflation: {rate} %/year from base year {basisjahr} (from the system file's index)."

# --- Aurora-Arbeitsmappe (v5.5) ----------------------------------------------
aurora_tab_mappe: "Workbook (Excel)"
aurora_tab_csv: "Single files (CSV)"
aurora_mappe_hinweis: "The Aurora \"Market Forecast Data\" workbook contains everything needed: capture prices and curtailment rates per design, wholesale prices and all price scenarios. One file yields several market price scenarios — one per price scenario."
aurora_mappe_label: "Aurora workbook (.xlsx / .xlsm)"
aurora_mappe_hilfe: "The complete workbook with the sheets \"Central\"/\"Low\"/\"High\" and \"Monthly prices\". Everything is located dynamically: sheet names, header rows and column order may differ between editions."
aurora_mappe_gefunden: "Found: {titel} · {geografie} · price base real {basisjahr}."
aurora_bauform_hilfe: "\"Pult\" is the south-facing fixed-tilt plant (Aurora: Fixed solar PV), \"Tracker\" the single-axis tracking one. The tracker generates more evenly across the day and is less exposed to the low-priced midday hours — its capture price is noticeably higher."
aurora_basisname_label: "Scenario name stem"
aurora_basisname_hilfe: "Scenarios are named \"stem · design · price scenario\", e.g. \"Aurora Q3/26 · Pult · Central\". That way they sit side by side in the project and can be run against each other as a sensitivity."
aurora_szenarien_label: "Price scenarios"
aurora_szenarien_hilfe: "Each selected price scenario becomes its own market price scenario. Importing all three pays off: the scenario comparison in the \"Risk\" tab then runs the project across all of them and shows the price range as a chart."
aurora_uebernimm_basisjahr: "Adopt price base"
aurora_uebernimm_basisjahr_hilfe: "Sets the base year of market price inflation to the workbook's price base (e.g. real 2025). The inflation rate itself is not in the workbook and stays unchanged."
aurora_mappe_erfolg: "{anzahl} scenarios saved ({technologie}, {von}–{bis}): {namen}."


annahmen_dv_modus_grosshandel: "Share of wholesale price (%)"
