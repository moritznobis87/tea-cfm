annahmen_negativstunden_modus_label: "Negative-hours mode"
annahmen_negativstunden_modus_hilfe: "Curtailment: revenue is fully lost for the share of negative hours. Fallback to annual market value: the plant keeps feeding in and receives the market value, only the market premium lapses. After the support period, the difference only matters in curtailment mode."
annahmen_erzeugung_negativ_hinweis: "Generation volume, negative hours: share of annual PV generation falling in periods of negative prices - a separate time series per rule (6h/1h). The rule selected above is the one applied."
