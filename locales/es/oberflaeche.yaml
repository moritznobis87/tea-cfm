annahmen_marktsystem_hinweis: "El selector de país cambia todo el sistema de mercado como paquete: regla de precios negativos (6h/1h), modo fiscal, método de cálculo de intereses, título de la aplicación y metodología de la página «Prima de mercado» (Austria: modelo empírico de subastas EAG; Alemania: prima de mercado EEG introducida manualmente). El cambio se guarda de inmediato y afecta a todos los proyectos; los ajustes individuales siguen siendo editables después."
