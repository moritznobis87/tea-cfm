# --- Zeitaufloesung, Foerdermodell, PPA (v5.4) --------------------------------
annahmen_modell_titel: "Resolución temporal, modelo de apoyo y PPA"
annahmen_zeitaufloesung_titel: "**Resolución temporal del cálculo de ingresos**"
annahmen_zeitaufloesung_hinweis: "La resolución anual enfrenta un volumen anual a un valor de mercado anual. La resolución mensual reparte la generación anual en doce meses mediante la curva de inyección y la valora con los valores de mercado mensuales del escenario: más exacto, porque la FV genera sobre todo cuando el precio es bajo. Flujo de caja, financiación e impuestos siguen siendo anuales."
annahmen_zeitaufloesung_label: "Resolución temporal"
annahmen_zeitaufloesung_hilfe: "Si un año natural no tiene valores mensuales, su valor anual se aplica a los doce meses; el cambio sigue siendo posible con datos incompletos."
annahmen_aufloesung_jahr: "Valores anuales"
annahmen_aufloesung_monat: "Valores mensuales"
annahmen_einspeisekurve_titel: "**Curva de inyección**"
annahmen_einspeisekurve_hinweis: "Parte de la generación anual por mes. Se aplica a todos los proyectos y se normaliza al 100 % al calcular, de modo que los porcentajes redondeados no alteran el volumen anual."
annahmen_einspeisekurve_summe: "Suma de las partes: {summe} % (se normaliza al 100 %)."
annahmen_col_monat: "Mes"
annahmen_col_anteil_jahreserzeugung: "Parte de la generación anual (%)"
annahmen_praemienmodell_titel: "**Modelo de prima de mercado**"
annahmen_praemienmodell_hinweis: "Forma contractual entre operador y organismo de apoyo. Decide qué ocurre por encima del valor de referencia; por debajo, los tres modelos complementan."
annahmen_praemienmodell_label: "Modelo"
annahmen_modell_einseitig: "CfD unilateral: retribución = MÁX(valor de mercado, valor de referencia)"
annahmen_modell_zweiseitig: "CfD bilateral: retribución = valor de referencia, el excedente se devuelve íntegro"
annahmen_modell_eag: "Bilateral con banda de tolerancia (EAG Austria): devolución solo por encima de la banda"
annahmen_eag_rueckzahlung_hinweis: "Parámetros de la banda de tolerancia. Según el § 10 EAG debe devolverse el 66 % del exceso cuando el valor de mercado de referencia supera en más del 40 % el valor de referencia; en fotovoltaica, a partir de 5 MW. Ajustable, ya que estas cifras están sujetas a reformas."
annahmen_eag_ab_mw_label: "Devolución a partir de (MW)"
annahmen_eag_ab_mw_hilfe: "Potencia a partir de la cual rige la obligación. Las plantas menores conservan íntegro su beneficio extraordinario. Se compara con la potencia nominal del proyecto."
annahmen_eag_band_label: "Banda de tolerancia (%)"
annahmen_eag_band_hilfe: "La devolución empieza solo por encima del valor de referencia incrementado en esta parte."
annahmen_eag_anteil_label: "Parte devuelta (%)"
annahmen_eag_anteil_hilfe: "Parte del importe por encima de la banda que vuelve al organismo de apoyo."
annahmen_ppa_titel: "**Valores por defecto del PPA**"
annahmen_ppa_hinweis: "Solo precarga del formulario de proyecto. El cálculo usa siempre los valores del proyecto: un PPA es contractual, no global."
annahmen_ppa_anteil_label: "Parte (%)"
annahmen_ppa_preis_label: "Precio (€/MWh)"
annahmen_ppa_laufzeit_label: "Plazo (años)"
annahmen_ppa_index_label: "Indexación (%/año)"
formular_ppa_titel: "**Comercialización (PPA / mercado)**"
formular_ppa_anteil_label: "Parte PPA (%)"
formular_ppa_anteil_hilfe: "Parte de la generación vendida al precio fijo del PPA; el resto va al mercado spot. 0 % = solo mercado. El apoyo no se ve afectado: la prima se mide contra el valor de mercado de referencia, no contra el precio realmente obtenido."
formular_ppa_preis_label: "Precio PPA (€/MWh)"
formular_ppa_preis_hilfe: "Precio acordado en el primer año del PPA; la indexación rige desde el segundo."
formular_ppa_laufzeit_label: "Plazo (años)"
formular_ppa_laufzeit_hilfe: "Número de años de operación desde el año inicial. Después se vende todo el volumen en el mercado."
formular_ppa_index_label: "Indexación (%/año)"
formular_ppa_index_hilfe: "Incremento anual del precio PPA. 0 = fijo nominal; 1-2 %/año es habitual en contratos largos."
formular_ppa_start_label: "Primer año de operación del PPA"
formular_ppa_start_hilfe: "1 = desde la puesta en marcha. Valores mayores reflejan primeros años aún vendidos en mercado."

