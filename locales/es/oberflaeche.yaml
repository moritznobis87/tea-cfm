annahmen_pacht_umsatzbeteiligung_vorschlag_hilfe: "Sirve solo como valor por defecto en el formulario «Nuevo proyecto» en modo Participación en ingresos; el valor específico del proyecto es el que realmente se aplica. Habitualmente en torno al 5,5 %."
annahmen_steuermodus_gewerbesteuer_de: "Impuesto comercial alemán"
annahmen_gewerbesteuer_hinweis: "Para sociedades personalistas como la GmbH & Co. KG: impuesto = MAX(EBT − amortización − deducción, 0) × tipo base (3,5 %) × multiplicador municipal. Deliberadamente sin arrastre de pérdidas (cada año se considera de forma independiente) - el impuesto comercial real sí contempla un arrastre de pérdidas (§10a GewStG), pero no se modela aquí por simplicidad."
annahmen_gewerbesteuer_hebesatz_label: "Multiplicador municipal (%)"
annahmen_gewerbesteuer_hebesatz_hilfe: "Depende del municipio, habitualmente 400-450 %."
annahmen_gewerbesteuer_freibetrag_label: "Deducción (€/año)"
annahmen_gewerbesteuer_freibetrag_hilfe: "Deducción legal para sociedades personalistas - a partir de 2026: 24.500 €/año."
annahmen_gewerbesteuer_effektiv_hinweis: "Tipo impositivo efectivo: {satz} % (3,5 % × multiplicador municipal)."

