auktion_intro_titel_de: "### Prima de mercado EEG (fotovoltaica, Alemania)"
auktion_intro_beschreibung_de: "Sistema de mercado alemán: la prima de mercado esperada (anzulegender Wert) se introduce manualmente. El modelo empírico de subastas (historial, ajuste de curvas, pronóstico) se basa en las subastas austriacas de OeMAG y está desactivado en el modo alemán."
