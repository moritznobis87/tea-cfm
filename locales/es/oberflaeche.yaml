# --- Aurora-Import (v5.5) -----------------------------------------------------
aurora_titel: "Importar datos de mercado de Aurora"
aurora_hinweis: "Aurora entrega cuatro archivos por escenario: sistema y tecnología, cada uno en resolución anual y mensual. Del archivo de tecnología salen el valor de mercado (capture price), las tasas de recorte y la curva de inyección; el de sistema aporta el índice de inflación y el año base. **El archivo mensual de tecnología es obligatorio**: sin valores mensuales no se pueden calcular el CfD bilateral ni la devolución."
aurora_tech_monat: "Tecnología – mensual (obligatorio)"
aurora_tech_monat_hilfe: "Contiene por tecnología y mes: capture price, curtailment rate below zero (1h/6h) y generation. De este archivo salen todas las curvas del escenario."
aurora_tech_jahr: "Tecnología – anual (opcional)"
aurora_tech_jahr_hilfe: "Se lee solo como contraste: si la media mensual ponderada por generación se desvía más del 2 % del valor anual indicado, aparece un aviso. El cálculo usa siempre los valores mensuales."
aurora_system_jahr: "Sistema – anual (recomendado)"
aurora_system_jahr_hilfe: "Aporta el índice de inflación («EUR Inflation, Index relative to …») y con ello el año base y la tasa media de las curvas de precio."
aurora_system_monat: "Sistema – mensual (opcional)"
aurora_system_monat_hilfe: "Fuente alternativa para el índice de inflación si falta el archivo anual."
aurora_warte_auf_datei: "Cargue primero el archivo mensual de tecnología: contiene el capture price y las tasas de recorte por mes."
aurora_keine_technologien: "El archivo no tiene columnas «Group»/«Subgroup»: no parece un archivo de tecnología de Aurora."
aurora_technologie_label: "Tecnología"
aurora_technologie_hilfe: "Las filas con las que se construye el escenario. Para una valoración FV, la tecnología solar del mercado; se preselecciona la entrada solar más general."
aurora_name_label: "Nombre del escenario"
aurora_name_hilfe: "Con este nombre aparece en el formulario de proyecto. Un escenario existente con el mismo nombre se sustituye: reimportar el mismo estudio es una corrección, no una segunda curva."
aurora_preisbasis_label: "Capture price"
aurora_preisbasis_hilfe: "El precio sin recorte es el correcto: el modelo aplica por sí mismo el efecto de los precios negativos mediante la tasa de recorte. Con el precio ya recortado contaría dos veces."
aurora_preis_uncurtailed: "Sin recorte (recomendado)"
aurora_preis_curtailed: "Recortado bajo cero"
aurora_uebernimm_kurve: "Adoptar la curva de inyección"
aurora_uebernimm_kurve_hilfe: "Deriva las doce partes mensuales de la generación mensual de la tecnología elegida (media de todos los años completos) y sustituye la curva actual."
aurora_uebernimm_inflation: "Adoptar la inflación"
aurora_uebernimm_inflation_hilfe: "Fija el año base y la tasa media de las curvas de precio a partir del índice de inflación del archivo de sistema."
aurora_setze_monatsmodus: "Cambiar a valores mensuales"
aurora_setze_monatsmodus_hilfe: "Pone el cálculo de ingresos en resolución mensual: requisito para que las curvas mensuales importadas surtan efecto."
aurora_importieren: "Comprobar e importar"
aurora_erfolg: "Escenario «{name}» guardado: {technologie}, {von}–{bis}, de los cuales {monatsjahre} años con series mensuales completas."
aurora_inflation_uebernommen: "Inflación de las curvas de precio: {rate} %/año desde el año base {basisjahr} (índice del archivo de sistema)."

# --- Aurora-Arbeitsmappe (v5.5) ----------------------------------------------
aurora_tab_mappe: "Libro de Excel"
aurora_tab_csv: "Archivos sueltos (CSV)"
aurora_mappe_hinweis: "El libro «Market Forecast Data» de Aurora contiene todo lo necesario: valores de mercado (capture price) y tasas de recorte por tecnología, precios mayoristas y todos los escenarios de precio. De un archivo salen varios escenarios de precio de mercado, uno por escenario."
aurora_mappe_label: "Libro de Aurora (.xlsx / .xlsm)"
aurora_mappe_hilfe: "El libro completo con las hojas «Central»/«Low»/«High» y «Monthly prices». Todo se localiza dinámicamente: nombres de hoja, filas de encabezado y orden de columnas pueden variar entre ediciones."
aurora_mappe_gefunden: "Encontrado: {titel} · {geografie} · base de precios real {basisjahr}."
aurora_bauform_hilfe: "«Pult» es la instalación fija orientada al sur (Aurora: Fixed solar PV), «Tracker» la de seguimiento a un eje. El tracker genera de forma más repartida a lo largo del día y sufre menos las horas centrales de precio bajo: su valor de mercado es claramente mayor."
aurora_basisname_label: "Raíz del nombre de los escenarios"
aurora_basisname_hilfe: "Los escenarios se llaman «raíz · tecnología · escenario de precio», p. ej. «Aurora Q3/26 GER · Pult · Central». Así conviven en el proyecto y pueden compararse como sensibilidad."
aurora_szenarien_label: "Escenarios de precio"
aurora_szenarien_hilfe: "Cada escenario seleccionado se convierte en un escenario de precio propio. Importar los tres merece la pena: la comparación de escenarios de la pestaña «Riesgo» calcula el proyecto con todos y muestra el rango de precios."
aurora_uebernimm_basisjahr: "Adoptar la base de precios"
aurora_uebernimm_basisjahr_hilfe: "Fija el año base de la inflación de los precios de mercado según el libro (p. ej. real 2025). La tasa de inflación no está en el libro y se mantiene."
aurora_mappe_erfolg: "{anzahl} escenarios guardados ({technologie}, {von}–{bis}): {namen}."


annahmen_dv_modus_grosshandel: "Porcentaje del precio mayorista (%)"